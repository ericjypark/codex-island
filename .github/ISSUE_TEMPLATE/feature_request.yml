name: Feature request
description: Suggest a new capability or a change to existing behavior.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/ericjypark/codex-island/issues) before suggesting a feature.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the app do? Sketches or examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Optional. What have you tried, and where does it fall short?
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to help?
      options:
        - label: I can test a build
        - label: I can contribute a PR
